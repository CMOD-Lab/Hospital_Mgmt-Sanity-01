version: "3.8"

services:
  hospitalmgmtapp:
    image: hospitalmgmtapp:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      # SQL Server connection string - override with actual value
      - DB_CONNECTION_STRING=${DB_CONNECTION_STRING:-Data Source=host.docker.internal;Initial Catalog=DBProject;User ID=sa;Password=YourPassword}
      # Redis / ElastiCache connection string for distributed session
      - REDIS_CONNECTION_STRING=${REDIS_CONNECTION_STRING:-host.docker.internal:6379,abortConnect=False}
      # Application environment
      - ASPNET_ENV=Production
    volumes:
      - app-logs:/inetpub/logs
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "powershell", "-Command",
             "try { $r = Invoke-WebRequest -Uri http://localhost/Health.aspx -UseBasicParsing -TimeoutSec 5; if ($r.StatusCode -eq 200) { exit 0 } else { exit 1 } } catch { exit 1 }"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s

volumes:
  app-logs:
    driver: local

networks:
  app-network:
    driver: bridge
