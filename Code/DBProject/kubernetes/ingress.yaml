apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clinic-management-system-ingress
  namespace: clinic-management-system
  labels:
    app: clinic-management-system
    component: web
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /Health.aspx
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "10"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
spec:
  rules:
    - host: clinic-management-system.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: clinic-management-system-service
                port:
                  number: 80
