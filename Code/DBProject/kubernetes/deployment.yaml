apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbproject
  namespace: dbproject
  labels:
    app: dbproject
    version: "1.0"
    component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dbproject
  template:
    metadata:
      labels:
        app: dbproject
        version: "1.0"
        component: web
    spec:
      nodeSelector:
        kubernetes.io/os: windows
      containers:
        - name: dbproject
          image: "{{IMAGE_URI}}"
          ports:
            - containerPort: 80
              protocol: TCP
          env:
            - name: DB_CONNECTION_STRING
              value: "{{DB_CONNECTION_STRING}}"
            - name: REDIS_CONNECTION_STRING
              value: "{{REDIS_CONNECTION_STRING}}"
            - name: APPINSIGHTS_INSTRUMENTATIONKEY
              value: "{{APPINSIGHTS_INSTRUMENTATIONKEY}}"
            - name: ASPNET_ENVIRONMENT
              value: "Production"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /Health.aspx
              port: 80
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /Health.aspx
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
      terminationGracePeriodSeconds: 60
