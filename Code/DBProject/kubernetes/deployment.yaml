apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospitalmgmtapp
  namespace: hospitalmgmtapp
  labels:
    app: hospitalmgmtapp
    version: "1.0"
    environment: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hospitalmgmtapp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: hospitalmgmtapp
        version: "1.0"
    spec:
      # Windows node selector - required for Windows containers (.NET Framework 4.5.2)
      nodeSelector:
        kubernetes.io/os: windows
      tolerations:
        - key: "os"
          operator: "Equal"
          value: "windows"
          effect: "NoSchedule"
      containers:
        - name: hospitalmgmtapp
          image: "{{IMAGE_URI}}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            # SQL Server connection string - set via Kubernetes Secret
            - name: DB_CONNECTION_STRING
              value: "{{DB_CONNECTION_STRING}}"
            # Redis / ElastiCache connection string for distributed session
            - name: REDIS_CONNECTION_STRING
              value: "{{REDIS_CONNECTION_STRING}}"
            # Application environment
            - name: ASPNET_ENV
              value: "Production"
            # Application port
            - name: PORT
              value: "80"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /Health.aspx
              port: 80
              scheme: HTTP
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /Health.aspx
              port: 80
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          lifecycle:
            preStop:
              exec:
                command: ["powershell", "-Command", "Start-Sleep -Seconds 15"]
      terminationGracePeriodSeconds: 60
